              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Successful login
  /auth/me:
    get:
      summary: Get Authenticated User Context & Target Access Model
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Canonical auth session payload per Target Access Model §7
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
                          phone: { type: string, nullable: true }
                          status: { type: string }
                      persona:
                        type: string
                        enum: [staff, student, parent]
                      profiles:
                        type: object
                        properties:
                          student: { type: object, nullable: true }
                          staff: { type: object, nullable: true }
                          parent: { type: object, nullable: true }
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            label: { type: string }
                      permissions:
                        type: object
                        additionalProperties:
                          type: string
                          enum: [self, linked, own, assigned, branch, tenant]
                      tenant:
                        type: object
                        properties:
                          id: { type: integer }
                          slug: { type: string }
                          name: { type: string }
                          modules:
                            type: array
                            items: { type: string }
                          auth_mode: { type: string }
                          branding: { type: object }
                      experience:
                        type: string
                        enum: [admin, staff, student, parent]
                      support_session:
                        type: object
                        nullable: true
