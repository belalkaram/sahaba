# =============================================================================
# Multi-Tenant LMS — Docker Compose
# Production stack: Nginx + PHP-FPM API + Next.js Web + Redis. Database = any Postgres via DB_URL
# (Neon today; swap provider by changing DB_URL only). A local Postgres is available with
# `--profile local-db` for self-hosting / offline use.
# =============================================================================

services:

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/html/public:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - lms_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Laravel API (PHP-FPM) ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: lms_api
    restart: unless-stopped
    environment:
      APP_ENV:              ${APP_ENV:-production}
      APP_KEY:              ${APP_KEY}
      APP_DEBUG:            "false"
      DB_CONNECTION:        pgsql
      DB_URL:               ${DB_URL}
      DB_SSLMODE:           ${DB_SSLMODE:-require}
      REDIS_HOST:           redis
      REDIS_PORT:           6379
      CACHE_DRIVER:         redis
      QUEUE_CONNECTION:     redis
      SESSION_DRIVER:       redis
      LOG_CHANNEL:          stderr
      LOG_LEVEL:            ${LOG_LEVEL:-warning}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Queue Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: lms_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV:          ${APP_ENV:-production}
      APP_KEY:          ${APP_KEY}
      DB_CONNECTION:        pgsql
      DB_URL:               ${DB_URL}
      DB_SSLMODE:           ${DB_SSLMODE:-require}
      REDIS_HOST:       redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL:      stderr
      LOG_LEVEL:        ${LOG_LEVEL:-warning}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lms_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # R8: runs lms:notify-scheduled, lms:compute-analytics, lms:refresh-platform-metrics
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: lms_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV:          ${APP_ENV:-production}
      APP_KEY:          ${APP_KEY}
      DB_CONNECTION:        pgsql
      DB_URL:               ${DB_URL}
      DB_SSLMODE:           ${DB_SSLMODE:-require}
      REDIS_HOST:       redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL:      stderr
      LOG_LEVEL:        ${LOG_LEVEL:-warning}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lms_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    container_name: lms_web
    restart: unless-stopped
    environment:
      NODE_ENV:             production
      NEXT_PUBLIC_API_URL:  ${NEXT_PUBLIC_API_URL:-/api}
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ | grep -q html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Optional local Postgres (profile: local-db) ───────────────────────────
  # Not started by default: production uses the managed Postgres in DB_URL.
  # Use with DB_URL=postgresql://lms:<password>@postgres:5432/lms?sslmode=disable
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lms
      POSTGRES_USER:     lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Cache / Queue / Session) ──────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: lms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  lms_network:
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
